[package]
name = "bench-harness"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "loadtest"
path = "src/main.rs"

[dependencies]
# Vireon crates
frame = { path = "../message-layer/frame" }
session-manager = { path = "../session-layer/session-manager" }
stream-manager = { path = "../stream-layer/stream-manager" }

# QUIC protocol
quiche = { workspace = true }

# Error handling + logging
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Concurrency + system
libc = { workspace = true }

# Global allocator — eliminates glibc arena explosion under 1000-thread
# burst allocation. mimalloc uses per-thread heaps with no cross-thread
# contention, reducing RSS by 4-8 GiB at 1000 connections.
mimalloc = "0.1"

# Signal handling
ctrlc = "3.4"

[lints]
workspace = true
