# ─────────────────────────────────────────────────────────────────────
# Vireon monorepo split configuration
#
# Format:  <local-folder>  <git-remote-url>
#
# Lines starting with # are ignored.  Put each folder on its own line.
# The remote URL can be SSH or HTTPS — whatever you have access to.
#
# Usage:
#   scripts/split-push.sh <folder>           # push split to remote main
#   scripts/split-push.sh <folder> -b feat   # push to feature branch
#   scripts/split-push.sh <folder> --pr      # push + create PR
#   scripts/split-push.sh all                # push every configured folder
#   scripts/split-push.sh --list             # show configured folders
#
# Fill in your repo URLs below.  Lines commented out with # are skipped.
# ─────────────────────────────────────────────────────────────────────

