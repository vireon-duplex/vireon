[package]
name = "frame"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["buffer-pool"]
# Pull in the in-tree `buffer-pool` crate to enable pool-backed encode paths
# (`FrameEncoder::encode_buffer_pooled`, `Frame::encode_pooled`, …). When off,
# the crate depends only on `bytes` + `thiserror`, matching its original
# zero-dep-encoded-bytes footprint.
buffer-pool = ["dep:buffer-pool"]

[dependencies]
bytes = { workspace = true }
thiserror = { workspace = true }
rustc-hash = { workspace = true }
buffer-pool = { path = "../../runtime-layer/buffer-pool", optional = true }
profiler = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# Pull the pool in for tests / benches of the pool-backed paths.
buffer-pool = { path = "../../runtime-layer/buffer-pool" }

[[bench]]
name = "frame_bench"
harness = false

[lints]
workspace = true
