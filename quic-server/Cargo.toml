[package]
name = "quic-server"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
autobenches = false

[lib]
name = "quic_server"
path = "src/lib.rs"

[[bench]]
name = "pubsub_dispatch"
harness = false

[dependencies]
# Vireon crates — one per architectural layer
# ── IO Layer ────────────────────────────────────────────────────────
io = { path = "../io-layer/io" }

# ── Kernel Layer ────────────────────────────────────────────────────
kernel-nic = { path = "../kernel-layer/kernel-nic" }

# ── Runtime Layer ───────────────────────────────────────────────────
connection-shard = { path = "../runtime-layer/connection-shard" }
timer-wheel = { path = "../runtime-layer/timer-wheel" }
buffer-pool = { path = "../runtime-layer/buffer-pool" }
send-queue = { path = "../runtime-layer/send-queue" }
task-queue = { path = "../runtime-layer/task-queue" }
cqe-processor = { path = "../runtime-layer/cqe-processor" }
vireon-reactor = { path = "../runtime-layer/reactor", package = "reactor" }

# ── Transport Layer ─────────────────────────────────────────────────
quic-engine = { path = "../transport-layer/quic-engine" }

# ── Message Layer ───────────────────────────────────────────────────
frame = { path = "../message-layer/frame" }

# ── Stream Layer ────────────────────────────────────────────────────
stream-manager = { path = "../stream-layer/stream-manager" }
stream-scheduler = { path = "../stream-layer/stream-scheduler" }
send-policy = { path = "../stream-layer/send-policy" }

# ── Session Layer ───────────────────────────────────────────────────
session-manager = { path = "../session-layer/session-manager" }
session-registry = { path = "../session-layer/session-registry" }
session-router = { path = "../session-layer/session-router" }
session-migration-manager = { path = "../session-layer/session-migration-manager" }
session-replication-service = { path = "../session-layer/session-replication-service" }

# ── Application Layer ───────────────────────────────────────────────
pubsub-engine = { path = "../application-layer/pubsub-engine" }
auth-framework = { path = "../application-layer/auth-framework" }
topic-acl = { path = "../application-layer/topic-acl" }
observability-sdk = { path = "../application-layer/observability-sdk" }
resource-quotas = { path = "../application-layer/resource-quotas" }
wal-store = { path = "../application-layer/wal-store" }
consumer-groups = { path = "../application-layer/consumer-groups" }
cluster-coordinator = { path = "../application-layer/cluster-coordinator" }

# QUIC protocol
quiche = { workspace = true }

# CLI parsing
clap = { version = "4.5", features = ["derive"] }

# Signal handling
ctrlc = "3.4"

# Error handling + logging
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Concurrency
libc = { workspace = true }

# Fast hashing for hot-path HashMaps.
rustc-hash = { workspace = true }

# Refcounted byte slices for zero-copy frame payloads.
bytes = { workspace = true }

# Function profiler (#[profile] instrumentation).
profiler = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[features]
default = []
# Activate profiler instrumentation at compile time.
# Usage: cargo run -p quic-server --features profiling
profiling = ["profiler/enabled"]

[lints]
workspace = true
