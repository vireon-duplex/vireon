[package]
name = "ws-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
vireon-sdk = { path = "../client-sdk" }
tokio = { workspace = true }
# tokio-tungstenite provides the WebSocket server side. We use the default
# feature set (no native-tls/rustls — TLS termination on the WS side is
# handled by an optional rustls path below; for local dev we run ws://).
tokio-tungstenite = "0.24"
futures-util = "0.3"
clap = { version = "4.5", features = ["derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }

[lints]
workspace = true
