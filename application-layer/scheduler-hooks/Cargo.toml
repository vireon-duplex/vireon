[package]
name = "scheduler-hooks"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
description = "Reactor scheduler hooks: pre/post-tick, pre-submit, post-complete, on-idle, on-wakeup triggers with priority ordering."
autobenches = false

[dependencies]
reactor = { path = "../../runtime-layer/reactor" }
thiserror = { workspace = true }
tracing  = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "hook_dispatch"
harness = false

[[bench]]
name = "priority_sort"
harness = false

[[bench]]
name = "tick_overhead"
harness = false

[[bench]]
name = "register"
harness = false

[lints]
workspace = true
