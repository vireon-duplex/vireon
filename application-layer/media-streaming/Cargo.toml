[package]
name = "media-streaming"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
description = "Media streaming: audio/video/screen tracks with adaptive bitrate, codec negotiation, and simulcast."
autobenches = false

[dependencies]
configuration-system = { path = "../configuration-system" }
middleware-pipeline  = { path = "../middleware-pipeline" }
resource-quotas      = { path = "../resource-quotas" }
session-manager      = { path = "../../session-layer/session-manager" }
stream-manager       = { path = "../../stream-layer/stream-manager" }
thiserror = { workspace = true }
tracing  = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bitrate_adjust"
harness = false

[[bench]]
name = "track_add"
harness = false

[[bench]]
name = "rtp_packetize"
harness = false

[[bench]]
name = "layer_switch"
harness = false

[lints]
workspace = true
