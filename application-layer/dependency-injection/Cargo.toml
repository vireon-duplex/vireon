[package]
name = "dependency-injection"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
description = "Dependency injection container: typed service tokens, lifetime management, and dependency graph resolution."
autobenches = false

[dependencies]
configuration-system = { path = "../configuration-system" }
service-registry     = { path = "../service-registry" }
thiserror = { workspace = true }
tracing  = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "resolve"
harness = false

[[bench]]
name = "register"
harness = false

[[bench]]
name = "scope_create"
harness = false

[[bench]]
name = "graph_build"
harness = false

[lints]
workspace = true
