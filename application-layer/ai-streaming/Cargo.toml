[package]
name = "ai-streaming"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
description = "AI streaming framework: token streaming, tool call aggregation, and pipeline management."
autobenches = false

[dependencies]
configuration-system  = { path = "../configuration-system" }
middleware-pipeline   = { path = "../middleware-pipeline" }
rpc-framework         = { path = "../rpc-framework" }
session-manager       = { path = "../../session-layer/session-manager" }
thiserror = { workspace = true }
tracing  = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "token_chunk"
harness = false

[[bench]]
name = "open_stream"
harness = false

[[bench]]
name = "tool_call"
harness = false

[[bench]]
name = "aggregate"
harness = false

[lints]
workspace = true
