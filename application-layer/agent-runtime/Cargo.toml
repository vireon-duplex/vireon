[package]
name = "agent-runtime"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
description = "Agent runtime: agent lifecycle, tool execution, context management, and scheduling."
autobenches = false

[dependencies]
configuration-system = { path = "../configuration-system" }
rpc-framework         = { path = "../rpc-framework" }
ai-streaming          = { path = "../ai-streaming" }
event-bus             = { path = "../event-bus" }
session-manager       = { path = "../../session-layer/session-manager" }
thiserror = { workspace = true }
tracing  = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "agent_lifecycle"
harness = false

[[bench]]
name = "tool_execute"
harness = false

[[bench]]
name = "context_switch"
harness = false

[[bench]]
name = "schedule"
harness = false

[lints]
workspace = true
