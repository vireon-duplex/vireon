[package]
name = "service-registry"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
description = "Application-level service discovery: service registration, health tracking, endpoint management, and load balancing."
autobenches = false

[dependencies]
configuration-system = { path = "../configuration-system" }
session-registry     = { path = "../../session-layer/session-registry" }
session-manager      = { path = "../../session-layer/session-manager" }
connection-shard     = { path = "../../runtime-layer/connection-shard" }
thiserror = { workspace = true }
tracing  = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "register"
harness = false

[[bench]]
name = "discover"
harness = false

[[bench]]
name = "health_check"
harness = false

[[bench]]
name = "load_balance"
harness = false

[lints]
workspace = true
