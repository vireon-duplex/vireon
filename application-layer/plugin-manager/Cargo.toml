[package]
name = "plugin-manager"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
description = "Plugin manager: versioned plugin loading with API compatibility checking and dependency resolution."
autobenches = false

[dependencies]
configuration-system = { path = "../configuration-system" }
version-negotiation  = { path = "../version-negotiation" }
thiserror = { workspace = true }
tracing  = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "load"
harness = false

[[bench]]
name = "unload"
harness = false

[[bench]]
name = "compatibility_check"
harness = false

[[bench]]
name = "discover"
harness = false

[lints]
workspace = true
