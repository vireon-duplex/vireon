[package]
name = "module-lifecycle"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
description = "Module lifecycle management: dependency-ordered init/start/stop phases with cycle detection."
autobenches = false

[dependencies]
configuration-system = { path = "../configuration-system" }
thiserror = { workspace = true }
tracing  = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "topo_sort"
harness = false

[[bench]]
name = "phase_transition"
harness = false

[[bench]]
name = "init_sequence"
harness = false

[[bench]]
name = "shutdown_sequence"
harness = false

[lints]
workspace = true
