[package]
name = "auth-framework"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
description = "Authentication and authorization framework: pluggable auth methods, RBAC/ABAC, token management."
autobenches = false

[dependencies]
configuration-system = { path = "../configuration-system" }
session-manager      = { path = "../../session-layer/session-manager" }
thiserror = { workspace = true }
tracing  = { workspace = true }
rustc-hash = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "authenticate"
harness = false

[[bench]]
name = "authorize"
harness = false

[[bench]]
name = "token_validate"
harness = false

[[bench]]
name = "role_check"
harness = false

[lints]
workspace = true
