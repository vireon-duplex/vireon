[package]
name = "ops-dashboard"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
description = "Operations dashboard: widget rendering, metrics collection, and health monitoring for the Vireon runtime."
autobenches = false

[dependencies]
configuration-system = { path = "../configuration-system" }
observability-sdk    = { path = "../observability-sdk" }
service-registry     = { path = "../service-registry" }
thiserror = { workspace = true }
tracing  = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "render_widget"
harness = false

[[bench]]
name = "query_range"
harness = false

[[bench]]
name = "collect_metrics"
harness = false

[[bench]]
name = "refresh"
harness = false

[lints]
workspace = true
