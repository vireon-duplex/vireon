[package]
name = "delivery-policy"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
description = "Per-stream receive-side delivery policy (ordered / unordered / drop-old / latest-only) for the Vireon pub/sub runtime."
autobenches = false

[dependencies]
bytes      = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
rustc-hash = { workspace = true }
frame      = { path = "../../message-layer/frame" }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "apply"
harness = false

[[bench]]
name = "drain"
harness = false

[[bench]]
name = "bind"
harness = false

[lints]
workspace = true
