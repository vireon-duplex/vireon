[package]
name = "session-registry"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
description = "Distributed session directory: SessionID → owner node via consistent hashing; cluster membership, ownership tables, and leases."
autobenches = false

[dependencies]
session-manager   = { path = "../session-manager" }
connection-shard  = { path = "../../runtime-layer/connection-shard" }
thiserror = { workspace = true }
tracing  = { workspace = true }
profiler = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "lookup"
harness = false

[[bench]]
name = "ring"
harness = false

[[bench]]
name = "membership"
harness = false

[[bench]]
name = "lease"
harness = false

[lints]
workspace = true
