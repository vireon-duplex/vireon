name: Release

# Triggers on semver tags (v0.1.0, v1.2.3) or manual dispatch.
# Builds the Linux release binary, creates a GitHub Release with the
# binary attached, and pushes a multi-arch Docker image to GHCR.
#
# No external secrets required — GHCR auth uses the auto-provided
# GITHUB_TOKEN. Docker Hub and crates.io publishing are intentionally
# not included (see plans/cozy-tinkering-dawn.md Phase B for the
# crates.io path; Docker Hub can be added later if needed).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0 — must include the leading v)'
        required: true
        type: string

permissions:
  contents: write   # create GitHub Release + upload assets
  packages: write   # push to ghcr.io

jobs:
  # ── 1. Linux release binary ─────────────────────────────────────────────
  #
  # Single target: x86_64-unknown-linux-gnu. The project uses io_uring
  # (Linux-only), so macOS and Windows builds are not viable.
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - uses: actions/checkout@v4

    - name: Resolve version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ inputs.version }}"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Releasing $VERSION"

    - name: Install Rust (MSRV 1.85)
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-release-

    - name: Build release
      run: cargo build --release -p quic-server

    - name: Strip binary
      run: strip target/release/quic-server

    - name: Package binary
      run: |
        mkdir -p dist
        cp target/release/quic-server dist/quic-server-linux-amd64
        # Minimal runtime docs next to the binary.
        cp README.md dist/
        cp LICENSE dist/

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: quic-server-linux-amd64
        path: dist/
        if-no-files-found: error

  # ── 2. GitHub Release ───────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: build-linux
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # full history for changelog generation

    - name: Download binary artifact
      uses: actions/download-artifact@v4
      with:
        name: quic-server-linux-amd64
        path: dist/

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.build-linux.outputs.version }}
        name: ${{ needs.build-linux.outputs.version }}
        generate_release_notes: true
        files: |
          dist/quic-server-linux-amd64
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Docker image → GHCR (multi-arch) ─────────────────────────────────
  docker-ghcr:
    name: Docker → GHCR
    needs: build-linux
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}
        labels: |
          org.opencontainers.image.title=Vireon
          org.opencontainers.image.description=QUIC-native pub/sub runtime

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
