[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/vireon-duplex/vireon.git"
authors = ["vireon-duplex"]
license = "GNU AFFERO GENERAL PUBLIC LICENSE v3.0"


[package]
name = "vireon"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "A high-performance realtime runtime built on QUIC and io_uring for multi-stream, full-duplex communication at massive scale."
repository = { workspace = true }
readme = "README.md"
license = { workspace = true }
keywords = ["quic", "io_uring", "async", "networking", "realtime", "high-performance"]
categories = ["network-programming","asynchronous","command-line-utilities","data-processing","development-tools","embedded","file-formats","parsing","protocols","serialization","system-programming"]
authors = { workspace = true }


[lib]
name = "vireon"
path = "src/lib.rs"

[[bin]]
name = "vireon"
path = "src/main.rs"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
debug = false
split-debuginfo = 'off'
debug-assertions = false
overflow-checks = true
lto = true
incremental = false
codegen-units = 1
rpath = false
strip = false

# Profiling build: full optimizations + debug symbols for perf/flamegraph.
# Usage: cargo flamegraph --profile flamegraph ...
[profile.flamegraph]
inherits = "release"
debug = "line-tables-only"
strip = false

[workspace]
members = ["io-layer/io","runtime-layer/buffer-pool", "runtime-layer/timer-wheel","message-layer/frame", "runtime-layer/send-queue", "runtime-layer/task-queue", "runtime-layer/cqe-processor", "kernel-layer/kernel-nic", "runtime-layer/connection-shard", "transport-layer/quic-engine", "runtime-layer/reactor", "stream-layer/stream-manager", "stream-layer/stream-scheduler", "stream-layer/delivery-policy", "stream-layer/send-policy", "session-layer/session-manager", "session-layer/session-registry", "session-layer/session-router", "session-layer/session-migration-manager", "session-layer/session-replication-service", "application-layer/auth-framework", "application-layer/observability-sdk", "application-layer/resource-quotas", "application-layer/pubsub-engine", "application-layer/wal-store", "application-layer/consumer-groups", "application-layer/cluster-coordinator", "application-layer/topic-acl", "quic-server", "quic-client", "ws-gateway", "bench-harness", "client-sdk", "profiler/macro", "profiler/runtime", "demo", "bindings/python","bindings/node","bindings/java","bindings/csharp","bindings/cpp","bindings/c","bindings/php","bindings/elixir/native/vireon_nifs"]
resolver = "2"
exclude = ["stream-layer/delivery-policy/fuzz"]

[workspace.lints]
rust = {}
clippy = { "unwrap_used" = "deny", "expect_used" = "deny", "panic" = "deny", "todo" = "deny", "unimplemented" = "deny", "unreachable" = "deny", "dbg_macro" = "deny", "print_stdout" = "deny", "print_stderr" = "deny" }

[workspace.dependencies]
# Curated catalog for workspace members. Only reference what each crate needs.
anyhow = "1"
bytes = "1"
thiserror = "2"
tracing = { version = "0.1", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
lazy_static = "1.5.0"
dotenv = "0.15.0"

# QUIC transport layer (consumed by transport-layer/quic-engine).
quiche  = "0.22"
libc    = "0.2"
socket2 = { version = "0.5", features = ["all"] }

# Async runtime for the client SDK (the server keeps its io_uring reactor).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

# Fast hashing for hot-path HashMaps (FxHash — no DoS resistance needed,
# thread-per-core with no untrusted keys).
rustc-hash = "2.1"

# Stack-allocated arrays with dynamic length for small scratch buffers.
# Used in hot paths to avoid heap allocation when the max size is known.
arrayvec = "0.7"

# Production-grade function profiler (#[profile] attribute macro).
profiler = { path = "profiler/runtime" }

# Config file (TOML) support for quic-server.
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Branch-free integer formatting for zero-alloc JSON ACKs.
itoa = "1"

# SHA-256 for audit-log hash chaining.
sha2 = "0.10"

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Application-layer crates wired into the vireon binary.
pubsub-engine          = { path = "application-layer/pubsub-engine" }
topic-acl              = { path = "application-layer/topic-acl" }
auth-framework         = { path = "application-layer/auth-framework" }

# Signal handling for graceful shutdown.
ctrlc = "3.4"

[dev-dependencies]
# Crates used only by examples/ — kept out of the runtime dep graph.
bytes          = { workspace = true }
frame          = { path = "message-layer/frame" }
delivery-policy = { path = "stream-layer/delivery-policy" }

[lints]
workspace = true
